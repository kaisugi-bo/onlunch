<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>オンランチ食券機</title>
<meta name="description" content="ボタンを押すたびにオンランチの話題が1つ出る、「お互いを知る」と「仕事の話」を切り替えて使える話題アプリ。">
<meta name="theme-color" content="#7724EB">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="オンランチ">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<style>
/* 1カラム。メニュー → 話題カード → ボタン の順に置くだけ */
:root {
  --bg: #FFFFFF; --fg: #1C1F26; --sub: #6B7080; --line: #E4E6EB; --soft: #F4F5F7;
  --accent: #7724EB; --accent-fg: #FFFFFF;
  --font: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #15171C; --fg: #ECEEF2; --sub: #9CA1AE; --line: #2C2F38; --soft: #1E2128; --accent: #9A5CF6; --accent-fg: #FFFFFF; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #15171C; --fg: #ECEEF2; --sub: #9CA1AE; --line: #2C2F38; --soft: #1E2128; --accent: #9A5CF6; --accent-fg: #FFFFFF; color-scheme: dark; }

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.7; -webkit-font-smoothing: antialiased;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: calc(env(safe-area-inset-top, 0px) + 32px) calc(env(safe-area-inset-bottom, 0px) + 40px); }
.wrap { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

h1 { margin: 0; font-size: 20px; font-weight: 700; }
.lead { margin: 2px 0 0; color: var(--sub); font-size: 13.5px; }

.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; background: var(--soft); border-radius: 12px; }
.mode { font-family: var(--font); font-size: 15px; font-weight: 700; cursor: pointer; border: none; border-radius: 9px; padding: 9px 8px; background: transparent; color: var(--sub); }
.mode[aria-pressed="true"] { background: var(--bg); color: var(--fg); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.modelead { margin: -12px 0 0; font-size: 13px; color: var(--sub); }

.card { border: 1px solid var(--line); border-radius: 14px; padding: 18px 22px 22px; min-height: 210px; display: flex; flex-direction: column; gap: 10px; }
.meta { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--sub); font-variant-numeric: tabular-nums; }
.topic { margin: 0; flex: 1; display: flex; align-items: center; font-size: clamp(24px, 5.2vw, 36px); font-weight: 700; line-height: 1.5; text-wrap: balance; word-break: auto-phrase; transition: opacity .18s; }
.topic.fade { opacity: 0; }

.next { font-family: var(--font); font-size: 17px; font-weight: 700; cursor: pointer; border: none; border-radius: 12px; padding: 15px 16px; background: var(--accent); color: var(--accent-fg); }
.next:hover { filter: brightness(1.07); }
.next:disabled { opacity: .35; cursor: default; filter: none; }
.topic.wait { font-size: 17px; font-weight: 500; color: var(--sub); }
.next:active { transform: translateY(1px); }
.row { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; font-size: 13px; color: var(--sub); margin-top: -8px; }
.row .links { display: flex; gap: 18px; }
.link { background: none; border: none; padding: 4px 0; font-family: var(--font); font-size: 13px; color: var(--sub); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.link:hover { color: var(--fg); }
.link:disabled { opacity: .4; cursor: default; text-decoration: none; }
.left { font-variant-numeric: tabular-nums; }


/* お弁当キャッチ */
.game { display: flex; flex-direction: column; gap: 10px; border-top: 1px solid var(--line); padding-top: 18px; }
.ghead { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.game h2 { margin: 0; font-size: 16px; font-weight: 700; }
.game h3 { margin: 0; font-size: 13px; font-weight: 700; color: var(--sub); }
.gscore { font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }
.grule { margin: 0; font-size: 12.5px; color: var(--sub); }
.gbox { position: relative; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--soft); }
#gcv { display: block; width: 100%; height: 340px; touch-action: none; }
.gover { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 16px; text-align: center; background: color-mix(in srgb, var(--bg) 82%, transparent); }
.gover[hidden] { display: none; }
.gtitle { margin: 0; font-size: 17px; font-weight: 700; white-space: pre-line; }
.gform { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.gform[hidden] { display: none; }
.gform input { font-family: var(--font); font-size: 15px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--fg); width: 10em; }
.gbtn { font-family: var(--font); font-size: 14px; font-weight: 700; cursor: pointer; border: 1px solid var(--line); border-radius: 10px; padding: 8px 16px; background: var(--bg); color: var(--fg); }
.gbtn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-size: 16px; padding: 10px 28px; }
.rank ol { list-style: none; margin: 6px 0 0; padding: 0; counter-reset: r; }
.rank li { counter-increment: r; display: grid; grid-template-columns: 2.2em 1fr auto; gap: 8px; padding: 7px 0; border-top: 1px solid var(--line); font-size: 14px; font-variant-numeric: tabular-nums; }
.rank li::before { content: counter(r) "位"; color: var(--sub); }
.rank li.new { color: var(--accent); font-weight: 700; }
.rank li.empty::before { content: ""; }
.rank li.empty { color: var(--sub); }

footer { font-size: 12.5px; color: var(--sub); }
footer p { margin: 0; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { .topic { transition: none; } }
/* 演出の強化（Lv.1 はカードが叩きつけられる／Lv.2 から全画面） */
.boostrow { display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: -6px; }
.boost { font-family: var(--font); font-size: 13px; font-weight: 700; cursor: pointer; border: 1px dashed var(--accent); color: var(--accent); background: transparent; border-radius: 999px; padding: 6px 16px; }
.boost:hover { background: var(--soft); }
.boost.max { border-style: solid; background: var(--accent); color: var(--accent-fg); }
.lv { font-size: 12px; font-weight: 700; color: var(--sub); font-variant-numeric: tabular-nums; letter-spacing: .06em; }
.card.slam { animation: slam .55s cubic-bezier(.2,1.4,.4,1) both, shake .35s .3s linear both; }
@keyframes slam { 0% { transform: scale(1.9) rotate(-4deg); opacity: 0; } 55% { transform: scale(.95) rotate(1deg); opacity: 1; } 100% { transform: none; } }
@keyframes shake { 0%,100% { translate: 0 0; } 20% { translate: -7px 3px; } 40% { translate: 6px -4px; } 60% { translate: -4px 2px; } 80% { translate: 3px -1px; } }

.stage { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; cursor: pointer; overflow: hidden;
  background: radial-gradient(circle at 50% 50%, #3B0F7A 0%, #12051F 70%); color: #FFFFFF;
  padding: calc(env(safe-area-inset-top, 0px) + 24px) max(20px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 24px) max(20px, env(safe-area-inset-left, 0px)); }
.stage[hidden] { display: none; }
.stage::before { content: ""; position: absolute; inset: -50%;
  background: repeating-conic-gradient(from 0deg, transparent 0deg 3deg, rgba(255,255,255,.55) 3deg 3.6deg, transparent 3.6deg 7deg, rgba(255,255,255,.3) 7deg 7.4deg);
  -webkit-mask: radial-gradient(circle, transparent 0 22%, #000 55%); mask: radial-gradient(circle, transparent 0 22%, #000 55%); }
.stage .flash { position: absolute; inset: 0; background: #FFFFFF; opacity: 0; pointer-events: none; }
.stage .sfx { position: absolute; font-family: var(--font); font-weight: 900; font-size: clamp(40px, 12vw, 120px); color: #FFC861; -webkit-text-stroke: 3px #12051F; paint-order: stroke; opacity: 0; transform: rotate(-12deg); pointer-events: none; }
.stage .sfx.a { left: 6%; top: 8%; } .stage .sfx.b { right: 6%; bottom: 10%; transform: rotate(10deg); }
.stage .q { position: relative; margin: 0; max-width: 16em; text-align: center; font-family: var(--font); font-weight: 900; font-size: clamp(34px, 8.5vw, 92px); line-height: 1.3; text-wrap: balance; word-break: auto-phrase;
  text-shadow: 0 0 2px #12051F, 4px 4px 0 #7724EB, 8px 8px 0 #FB4FDE; }
.stage .q span { display: inline-block; }
.stage .tap { position: absolute; bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); left: 0; right: 0; text-align: center; font-size: 12px; letter-spacing: .1em; color: rgba(255,255,255,.65); }
.stage.on { animation: shake .4s .35s linear both; }
.stage.on::before { animation: spin 12s linear infinite; }
.stage.on .flash { animation: flash .45s .3s ease-out both; }
.stage.on .q { animation: slamq .6s cubic-bezier(.2,1.5,.4,1) both; }
/* Lv.MAX は宇宙。星が光速で流れ、遠くの惑星を背に、質問が奥から浮かび上がる */
.stage .space { display: none; position: absolute; inset: 0; pointer-events: none; }
.stage.lv3 { background: radial-gradient(ellipse at 50% 45%, #2A1460 0%, #0B0620 45%, #000000 80%); }
.stage.lv3::before { display: none; }
.stage.lv3 .sfx, .stage.lv3 .flash { display: none; }
.stage.lv3 .space { display: block; }
.stars { position: absolute; inset: 0; -webkit-mask: radial-gradient(circle, transparent 0 16vmin, #000 34vmin); mask: radial-gradient(circle, transparent 0 16vmin, #000 34vmin); }
.stars span { position: absolute; left: 50%; top: 50%; width: 3px; height: 2px; border-radius: 2px; background: #FFFFFF; opacity: 0; transform-origin: 0 50%;
  transform: rotate(var(--a)) translateX(2vmax); animation: warp var(--s) var(--d) cubic-bezier(.55,0,1,.6) infinite; }
@keyframes warp { 0% { opacity: 0; transform: rotate(var(--a)) translateX(2vmax) scaleX(1); } 15% { opacity: .9; } 100% { opacity: 1; transform: rotate(var(--a)) translateX(75vmax) scaleX(26); } }
.nebula { position: absolute; inset: -20%; background: radial-gradient(circle at 25% 30%, rgba(251,79,222,.28), transparent 35%), radial-gradient(circle at 75% 70%, rgba(80,170,255,.25), transparent 40%); animation: drift 14s ease-in-out infinite alternate; }
@keyframes drift { to { transform: translate(-4%, 3%) scale(1.08); } }
.planet { position: absolute; right: -8vmin; bottom: -10vmin; width: 46vmin; height: 46vmin; border-radius: 50%;
  background: radial-gradient(circle at 32% 30%, #C8A8FF 0%, #7724EB 35%, #2A0B66 70%, #0B0620 100%); box-shadow: 0 0 60px rgba(165,123,255,.45); animation: rise 1.4s .2s cubic-bezier(.2,.8,.2,1) both; }
.planet::after { content: ""; position: absolute; left: -22%; top: 42%; width: 144%; height: 16%; border-radius: 50%; border: 3px solid rgba(255,200,97,.7); transform: rotate(-18deg); }
@keyframes rise { from { transform: translate(20vmin, 20vmin); opacity: 0; } }
.cosmos { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 28px); left: 0; right: 0; margin: 0; text-align: center; font-size: 13px; letter-spacing: .5em; color: rgba(200,220,255,.8); animation: fadein 1.2s .3s both; }
@keyframes fadein { from { opacity: 0; letter-spacing: 1.4em; } }
.stage.lv3 .q { text-shadow: 0 0 12px rgba(160,200,255,.9), 0 0 32px rgba(119,36,235,.9), 0 0 60px rgba(251,79,222,.6); }
.stage.lv3.on .q { animation: none; }
.stage.lv3.on .q span { animation: emerge 1.1s cubic-bezier(.15,.9,.25,1) both; animation-delay: calc(var(--i) * 90ms + .4s); }
@keyframes emerge { 0% { transform: scale(.02) translateZ(0); opacity: 0; filter: blur(8px); } 60% { opacity: 1; filter: blur(0); } 100% { transform: none; opacity: 1; } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes flash { 0% { opacity: .9; } 100% { opacity: 0; } }
@keyframes slamq { 0% { transform: scale(5) rotate(-10deg); opacity: 0; filter: blur(6px); } 60% { transform: scale(.9) rotate(2deg); opacity: 1; filter: none; } 100% { transform: none; } }
@keyframes drop { 0% { transform: translateY(-120vh) rotate(-30deg) scale(2); opacity: 0; } 70% { transform: translateY(6px) rotate(4deg) scale(1); opacity: 1; } 100% { transform: none; opacity: 1; } }
@keyframes sfx { 0% { opacity: 0; scale: 3; } 100% { opacity: 1; scale: 1; } }
@media (prefers-reduced-motion: reduce) {
  .card.slam, .stage.on, .stage.on::before, .stage.on .flash, .stage.on .q, .stage.lv3.on .q span, .stage.lv3.on .sfx, .stars span, .nebula, .planet, .cosmos { animation: none !important; }
  .stars span { opacity: .8; }
  .stage .sfx { opacity: 1; }
}

</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>オンランチ食券機</h1>
    <p class="lead">ボタンを押すと話題が1つ出ます。ピンとこなければ、どんどん次へ。</p>
  </header>

  <div class="modes" id="modes" role="group" aria-label="話題の種類"></div>
  <p class="modelead" id="modelead"></p>

  <article class="card" aria-live="polite">
    <div class="meta"><span id="cat"></span><span id="no">No.1</span></div>
    <p class="topic" id="topic"></p>
  </article>

  <button class="next" id="next" type="button">次の話題</button>
  <div class="row">
    <div class="links">
      <button class="link" id="back" type="button" disabled>ひとつ前に戻る</button>
      <button class="link" id="reset" type="button">出た話題をリセット</button>
    </div>
    <span class="left" id="left"></span>
  </div>

  <div class="boostrow">
    <button class="boost" id="boost" type="button">演出を強化する</button>
    <span class="lv" id="lv" hidden></span>
  </div>

  <section class="game" id="game" aria-label="お弁当キャッチ">
    <div class="ghead"><h2>お弁当キャッチ</h2><span class="gscore" id="gscore"></span></div>
    <p class="grule">おかずをお弁当箱で受け止める。ピーマンを取るか、おかずを落とすと1ミス。3ミスで終了。指でなぞるか、← → キーで動かす。</p>
    <div class="gbox">
      <canvas id="gcv" aria-label="ゲーム画面"></canvas>
      <div class="gover" id="gover">
        <p class="gtitle" id="gtitle">ひとりずつ挑戦して、ランキングで競おう</p>
        <form class="gform" id="gform" hidden><input id="gname" maxlength="12" placeholder="名前" autocomplete="off" aria-label="名前"><button type="submit" class="gbtn">ランキングに登録</button></form>
        <button class="gbtn primary" id="gstart" type="button">スタート</button>
      </div>
    </div>
    <div class="rank"><div class="ghead"><h3>今日のランキング</h3><button class="link" id="grclear" type="button">ランキングを消す</button></div><ol id="grank"></ol></div>
  </section>

  <footer>
    <p>話が広がったら、そのまま放置してください。スペースキーでも次の話題を出せます。</p>
  </footer>
</div>

<div class="stage" id="stage" hidden role="dialog" aria-modal="true" aria-label="話題">
  <div class="flash"></div>
  <span class="sfx a" style="--d:.15s">ドンッ</span><span class="sfx b" style="--d:.35s">ドドドド</span>
  <div class="space" aria-hidden="true"><div class="nebula"></div><div class="stars" id="stars"></div><div class="planet"></div><p class="cosmos">宇宙からの問い</p></div>
  <p class="q" id="stageq"></p>
  <p class="tap">タップで閉じる</p>
</div>

<script>
(() => {
const MODES = {
  fun: { name: "お互いを知る", lead: "仕事以外のことで、お互いを知るための話題です。", menu: [
  { k: "day", name: "日替わり" }, { k: "fav", name: "定番" }, { k: "if", name: "もしも" }, { k: "old", name: "むかし話" }
], topics: {
    day: ["最近いちばん笑ったこと", "最近変えた小さな習慣", "今年のうちにやっておきたいこと", "年末年始の過ごし方、もう決まってる？", "最近気になっているお店や場所", "最近知ったちょっとした雑学", "最近、自分をほめたいこと", "最近始めたこと、またはやめたこと", "この1週間でいちばんおいしかったもの"],
    fav: ["何度でも聴いてしまう曲", "自分なりのストレス解消法",
      "人に言うと驚かれる小さなこだわり", "地元の名物で、人に自慢したいもの", "自分の住んでいる地域の「あるある」", "理想の休日を時間割で言うと？"],
    if: ["好きな作品の世界に1日だけ入れるなら、どれ？", "人生のテーマ曲を1曲選ぶなら？",
      "タイムマシンに1回乗れるなら、過去と未来どっちに行く？", "1週間まるごと休みがもらえたら、何をする？", "魔法が1つだけ使えるなら、どんな魔法？"],
    old: ["子どものころの得意技", "小学生のころの将来の夢", "子どものころ、よくやっていた遊び", "学生時代にハマっていたもの"]
  } },
  work: { name: "仕事の話", lead: "社内の仕事のことを、少しまじめに話すための話題です。", menu: [
    { k: "now", name: "いまの仕事" }, { k: "term", name: "今期のこと" }, { k: "help", name: "困りごと" }, { k: "like", name: "好きな仕事" }
  ], topics: {
    now: ["いまってどんな仕事をしてる？", "1日の流れをざっくり教えて", "最近いちばん時間を使っている仕事は？", "最近、手応えがあった仕事は？", "いま一緒に仕事をすることが多い人は？", "入社してから、仕事でいちばん変わったことは？"],
    term: ["今期のいちばんのミッションは？", "今期これができたら最高、と思うことは？", "年内に片付けておきたい仕事は？", "いまいちばん追いかけている数字は？", "チームの今期の目標をひとことで言うと？", "今期の山場はいつ？"],
    help: ["いま困っていることは？", "いちばん助けがほしいことは？", "ほかのチームに聞いてみたいことは？", "なくしたい作業や手間は？", "もっと早く知りたかった社内の情報は？", "AI に任せたいのに、まだ任せられていない仕事は？"],
    like: ["仕事の中で好きな仕事は？", "時間を忘れてやれる仕事は？", "最近うれしかった、お客さんや同僚のひとこと", "ブリングアウトに入ってよかったと思った瞬間", "ほかのチームでやってみたい仕事は？", "自分の仕事で、もっと知ってほしいことは？"]
  } }
};

// 出た話題はこの端末にだけ覚えておく（使えなければ覚えずに動く）
const KEY = "onlunch-kenbaiki.seen.v1";
const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { return []; } };
const save = v => { try { localStorage.setItem(KEY, JSON.stringify(v)); } catch (e) {} };
let seen = load(), filter = "all", history = [], cursor = -1, no = 1;
let mode = null;
let ALL = [], nameOf = {};
const $ = id => document.getElementById(id);
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

function setMode(k) {
  mode = k; filter = "all";
  const M = MODES[k];
  ALL = M.menu.flatMap(m => M.topics[m.k].map(t => ({ t, c: m.k })));
  nameOf = Object.fromEntries(M.menu.map(m => [m.k, m.name]));
  $("modes").innerHTML = Object.entries(MODES).map(([key, x]) => `<button class="mode" type="button" data-m="${key}" aria-pressed="${key === k}">${x.name}</button>`).join("");
  $("modelead").textContent = M.lead;
}
$("modes").addEventListener("click", e => {
  const b = e.target.closest(".mode"); if (!b || b.dataset.m === mode) return;
  setMode(b.dataset.m); history = []; cursor = -1; no = 0; $("next").disabled = false; next();
});

const pool = () => ALL.filter(x => filter === "all" || x.c === filter);
function updateLeft() { const p = pool(); $("left").textContent = `残り ${p.filter(x => !seen.includes(x.t)).length} / ${p.length}`; }
function draw() {
  const p = pool(); let fresh = p.filter(x => !seen.includes(x.t));
  if (!fresh.length) { seen = seen.filter(t => !p.some(x => x.t === t)); save(seen); fresh = p; }
  return fresh[Math.floor(Math.random() * fresh.length)];
}
function paint(h) { $("topic").classList.remove("wait"); $("cat").textContent = nameOf[h.item.c]; $("no").textContent = "No." + h.no; $("topic").textContent = h.item.t; }
function show(h, push) {
  if (push) { history = history.slice(0, cursor + 1); history.push(h); cursor = history.length - 1; if (!seen.includes(h.item.t)) { seen.push(h.item.t); save(seen); } }
  const topic = $("topic");
  if (reduced) paint(h); else { topic.classList.add("fade"); setTimeout(() => { paint(h); topic.classList.remove("fade"); }, 180); }
  $("back").disabled = cursor <= 0;
  updateLeft();
}

// 演出の強化。押すたびに Lv が上がり、Lv.3 の次で元に戻る
const BOOST = ["演出を強化する", "演出をさらに強化する", "演出を限界まで強化する", "演出を元に戻す"];
const LVNAME = ["", "演出 Lv.1", "演出 Lv.2", "演出 Lv.MAX"];
let boost = 0;
$("boost").addEventListener("click", () => {
  boost = (boost + 1) % 4;
  $("boost").textContent = BOOST[boost];
  $("boost").classList.toggle("max", boost === 3);
  $("lv").hidden = boost === 0; $("lv").textContent = LVNAME[boost];
});
function closeStage() { $("stage").hidden = true; $("stage").classList.remove("on"); }
function openStage(text) {
  const st = $("stage"), q = $("stageq");
  st.classList.remove("on", "lv3"); q.textContent = "";
  if (boost === 3) {
    // 単語のまとまりごとに落とす（文字ごとだと、変なところで改行される）
    let chars;
    try { chars = [...new Intl.Segmenter("ja", { granularity: "word" }).segment(text)].map(x => x.segment); } catch (e) { chars = [...text]; }
    // 句読点や空白は前のまとまりにくっつけ、行頭に来ないようにする
    chars = chars.reduce((a, c) => { if (a.length && /^[\s、。，．！？!?」』）)]+$/.test(c)) a[a.length - 1] += c; else a.push(c); return a; }, []);
    chars.forEach((c, i) => { const sp = document.createElement("span"); sp.textContent = c; sp.style.setProperty("--i", i); q.appendChild(sp); });
    st.style.setProperty("--n", chars.length); st.classList.add("lv3");
    if (!$("stars").childElementCount) $("stars").innerHTML = Array.from({ length: 140 }, () =>
      `<span style="--a:${(Math.random() * 360).toFixed(1)}deg;--d:${(-Math.random() * 2).toFixed(2)}s;--s:${(0.9 + Math.random() * 1.4).toFixed(2)}s"></span>`).join("");
    try { navigator.vibrate && navigator.vibrate([60, 40, 120]); } catch (e) {}
  } else q.textContent = text;
  st.hidden = false; void st.offsetWidth; st.classList.add("on");
}
function stagger(h) {
  if (boost === 1) { const c = document.querySelector(".card"); c.classList.remove("slam"); void c.offsetWidth; c.classList.add("slam"); }
  else if (boost >= 2) openStage(h.item.t);
}
$("stage").addEventListener("click", closeStage);
const next = () => { if (!mode) return; no += 1; const h = { item: draw(), no }; show(h, true); stagger(h); };
$("next").addEventListener("click", next);
$("back").addEventListener("click", () => { if (cursor > 0) { cursor -= 1; show(history[cursor], false); } });
$("reset").addEventListener("click", () => { seen = []; save(seen); updateLeft(); $("reset").textContent = "リセットしました"; setTimeout(() => $("reset").textContent = "出た話題をリセット", 1600); });
document.addEventListener("keydown", e => {
  if (!$("stage").hidden && (e.code === "Escape" || e.code === "Space")) { e.preventDefault(); closeStage(); return; }
  if (e.code !== "Space" || e.repeat || e.target.closest("button, input, textarea, select, a")) return;
  e.preventDefault(); next();
});

// 開いた時点ではどちらも選ばず、選んだら1つ目の話題を出す
$("modes").innerHTML = Object.entries(MODES).map(([key, x]) => `<button class="mode" type="button" data-m="${key}" aria-pressed="false">${x.name}</button>`).join("");
$("modelead").textContent = "まず、どちらの話題にするかを選んでください。";
$("cat").textContent = ""; $("no").textContent = "";
$("topic").textContent = "上のボタンを押すと、話題が出ます"; $("topic").classList.add("wait");
$("next").disabled = true;
})();
</script>

<script>
// お弁当キャッチ。降ってくるおかずを受け止める。ピーマンを取るか、おかずを落とすと1ミス
(() => {
const cv = document.getElementById("gcv"), ctx = cv.getContext("2d");
const $ = id => document.getElementById(id);
const GOOD = [{ e: "🍙", p: 10 }, { e: "🍗", p: 20 }, { e: "🥚", p: 10 }, { e: "🍤", p: 30 }, { e: "🍅", p: 10 }, { e: "🥩", p: 20 }];
const RKEY = "onlunch-kenbaiki.rank.v1", NKEY = "onlunch-kenbaiki.name.v1";
const loadR = () => { try { return JSON.parse(localStorage.getItem(RKEY)) || []; } catch (e) { return []; } };
const saveR = v => { try { localStorage.setItem(RKEY, JSON.stringify(v)); } catch (e) {} };
let W = 0, H = 0, box, items, score, miss, t, last, spawnIn, raf = 0, playing = false, keys = {}, lastNew = -1, combo, pops;

function size() {
  const r = cv.getBoundingClientRect(), d = Math.min(window.devicePixelRatio || 1, 2);
  W = r.width; H = r.height; cv.width = W * d; cv.height = H * d; ctx.setTransform(d, 0, 0, d, 0, 0);
  if (!playing) drawIdle();
}
function drawBox() {
  const x = box.x, y = H - 46, w = box.w;
  ctx.fillStyle = "#2B2B33"; ctx.beginPath(); ctx.roundRect(x - w / 2, y, w, 34, 7); ctx.fill();
  ctx.fillStyle = "#C0392B"; ctx.fillRect(x - w / 2 + 4, y + 4, w - 8, 26);
  ctx.fillStyle = "#F6E7C8"; ctx.fillRect(x - w / 2 + 8, y + 8, w / 2 - 12, 18);
  ctx.fillStyle = "#E9C46A"; ctx.fillRect(x + 4, y + 8, w / 2 - 12, 18);
}
function drawIdle() {
  ctx.clearRect(0, 0, W, H); box = { x: W / 2, w: Math.max(76, W * .17) };
  ctx.font = "34px serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  [["🍙", .2, .25], ["🍗", .45, .15], ["🫑", .7, .3], ["🍤", .85, .12], ["🥚", .35, .45]].forEach(([e, x, y]) => ctx.fillText(e, W * x, H * y));
  drawBox();
}
function hud() { $("gscore").textContent = `${score} 点　ミス ${"●".repeat(miss)}${"○".repeat(3 - miss)}`; }
function start() {
  size(); box = { x: W / 2, w: Math.max(76, W * .17) };
  items = []; pops = []; score = 0; miss = 0; t = 0; combo = 0; spawnIn = 0.4; lastNew = -1;
  $("gover").hidden = true; playing = true; hud(); last = performance.now(); cancelAnimationFrame(raf); raf = requestAnimationFrame(loop);
}
function spawn() {
  const lvl = Math.min(t / 60, 1);
  const bad = Math.random() < .18 + lvl * .14, gold = !bad && Math.random() < .04;
  const it = bad ? { e: "🫑", p: 0, bad: true } : gold ? { e: "🍱", p: 100, gold: true } : GOOD[Math.floor(Math.random() * GOOD.length)];
  items.push({ ...it, x: 24 + Math.random() * (W - 48), y: -20, v: 110 + lvl * 220 + Math.random() * 60, r: (Math.random() - .5) * 2, a: 0 });
  spawnIn = Math.max(.32, 1.0 - lvl * .65) * (.7 + Math.random() * .6);
}
function loop(now) {
  const dt = Math.min((now - last) / 1000, .05); last = now; t += dt;
  const sp = Math.max(320, W * .9);
  if (keys.ArrowLeft) box.x -= sp * dt; if (keys.ArrowRight) box.x += sp * dt;
  box.x = Math.max(box.w / 2, Math.min(W - box.w / 2, box.x));
  if ((spawnIn -= dt) <= 0) spawn();
  const top = H - 46;
  for (const it of items) {
    it.y += it.v * dt; it.a += it.r * dt;
    if (!it.done && it.y >= top - 6 && it.y <= top + 16 && Math.abs(it.x - box.x) < box.w / 2 + 6) {
      it.done = true;
      if (it.bad) { miss++; combo = 0; pops.push({ x: it.x, y: top - 20, s: "うっ…", c: "#2E7D32", t: 0 }); }
      else { combo++; const g = it.p + (combo >= 5 ? 10 : 0); score += g; pops.push({ x: it.x, y: top - 20, s: (it.gold ? "幕の内！" : "") + "+" + g + (combo >= 5 ? ` ${combo}連` : ""), c: it.gold ? "#D4A017" : "#7724EB", t: 0 }); }
      hud();
    } else if (!it.done && it.y > H + 20) { it.done = true; if (!it.bad) { miss++; combo = 0; pops.push({ x: it.x, y: H - 70, s: "落とした！", c: "#C0392B", t: 0 }); hud(); } }
  }
  items = items.filter(it => !it.done);
  ctx.clearRect(0, 0, W, H);
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  for (const it of items) { ctx.save(); ctx.translate(it.x, it.y); ctx.rotate(it.a); ctx.font = (it.gold ? 40 : 32) + "px serif"; ctx.fillText(it.e, 0, 0); ctx.restore(); }
  drawBox();
  ctx.font = "bold 15px sans-serif";
  pops = pops.filter(pp => (pp.t += dt) < .8);
  for (const pp of pops) { ctx.globalAlpha = 1 - pp.t / .8; ctx.fillStyle = pp.c; ctx.fillText(pp.s, pp.x, pp.y - pp.t * 40); }
  ctx.globalAlpha = 1;
  if (miss >= 3) return end();
  raf = requestAnimationFrame(loop);
}
function title(sc) { return sc >= 800 ? "伝説の料理長" : sc >= 500 ? "お弁当マイスター" : sc >= 300 ? "なかなかの腕前" : sc >= 120 ? "見習いさん" : "お腹ぺこぺこ"; }
function end() {
  playing = false; keys = {};
  $("gtitle").textContent = `${score} 点\n称号「${title(score)}」`;
  $("gform").hidden = score <= 0; $("gstart").textContent = "もう一回";
  try { $("gname").value = localStorage.getItem(NKEY) || ""; } catch (e) {}
  $("gover").hidden = false;
  if (score > 0) $("gname").focus({ preventScroll: true });
}
function renderRank() {
  const r = loadR();
  $("grank").innerHTML = r.length ? r.map((x, i) => `<li class="${i === lastNew ? "new" : ""}"><span></span><span>${x.s} 点</span></li>`).join("") : `<li class="empty"><span>まだ記録がありません</span><span></span></li>`;
  [...$("grank").querySelectorAll("li:not(.empty)")].forEach((li, i) => li.children[0].textContent = r[i].n);
}
$("gform").addEventListener("submit", e => {
  e.preventDefault();
  const n = $("gname").value.trim() || "名無しの料理人";
  try { localStorage.setItem(NKEY, n); } catch (er) {}
  const r = loadR(); const rec = { n, s: score, at: Date.now() }; r.push(rec);
  r.sort((a, b) => b.s - a.s || a.at - b.at); const top = r.slice(0, 10); lastNew = top.indexOf(rec);
  saveR(top); renderRank(); $("gform").hidden = true;
  $("gtitle").textContent = lastNew >= 0 ? `${score} 点で ${lastNew + 1} 位に入った！` : `${score} 点。ランキング入りならず`;
});
$("gstart").addEventListener("click", start);
let armed = false;
$("grclear").addEventListener("click", e => {
  if (!armed) { armed = true; e.target.textContent = "もう一度押すと消える"; setTimeout(() => { armed = false; e.target.textContent = "ランキングを消す"; }, 3000); return; }
  saveR([]); lastNew = -1; armed = false; e.target.textContent = "ランキングを消す"; renderRank();
});
const moveTo = e => { if (!playing) return; const r = cv.getBoundingClientRect(); box.x = e.clientX - r.left; };
cv.addEventListener("pointerdown", e => { moveTo(e); cv.setPointerCapture?.(e.pointerId); });
cv.addEventListener("pointermove", e => { if (e.buttons || e.pointerType !== "mouse") moveTo(e); });
// 遊んでいる間は矢印とスペースをゲームが使う（話題が進まないように）
addEventListener("keydown", e => {
  if (!playing) return;
  if (["ArrowLeft", "ArrowRight", "Space"].includes(e.code)) { e.preventDefault(); e.stopImmediatePropagation(); keys[e.code] = true; }
}, true);
addEventListener("keyup", e => { keys[e.code] = false; }, true);
addEventListener("resize", size);
size(); renderRank();
})();
</script>

// ホーム画面に追加したとき、電波がなくても開けるようにする
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
